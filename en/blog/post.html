<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… — Dietfit</title>
  <!-- Link cũ dạng post.html?slug=... — bài viết đã chuyển sang /en/blog/<slug>/.
       Vercel redirect 301 trước (vercel.json); file này chỉ là dự phòng khi chạy local. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://dietfit.health/en/blog/">
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get("slug");
      location.replace("/en/blog/" + (slug && /^[a-z0-9-]+$/.test(slug) ? slug + "/" : ""));
    })();
  </script>
</head>
<body>
  <p><a href="/en/blog/">Redirecting…</a></p>
</body>
</html>
